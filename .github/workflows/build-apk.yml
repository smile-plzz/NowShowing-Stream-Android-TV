name: Build and Release Android TV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in app/build.gradle.kts after successful checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nowshowing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Restore optional permanent release key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" != "true" ] && [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
            chmod 600 "$RUNNER_TEMP/release-key.jks"
            echo "mode=permanent" >> "$GITHUB_OUTPUT"
          else
            echo "mode=development" >> "$GITHUB_OUTPUT"
          fi
      - name: Run unit tests and validate release scripts
        run: |
          chmod +x gradlew
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug and release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Package versioned downloads and signing report
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: python3 scripts/package_release.py
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: NowShowing-TV-Release-Bundle
          path: dist/*
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NowShowing-TV-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NowShowing-TV-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.jks"

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NowShowing-TV-Release-Bundle
          path: dist
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
